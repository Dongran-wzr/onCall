<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On-Call 助手搜索</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }
        body {
            margin: 0;
            background: #f5f7fb;
            color: #1f2937;
        }
        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }
        .hero {
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }
        .subtitle {
            margin: 0 0 18px;
            color: #4b5563;
        }
        .search-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        input[type="search"] {
            flex: 1;
            min-width: 240px;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
        }
        .meta {
            margin-top: 14px;
            color: #6b7280;
            font-size: 14px;
        }
        .results {
            margin-top: 24px;
            display: grid;
            gap: 14px;
        }
        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        }
        .card h2 {
            margin: 0 0 8px;
            font-size: 18px;
        }
        .doc-id {
            color: #2563eb;
            font-weight: 700;
        }
        .snippet {
            margin: 10px 0;
            line-height: 1.7;
            color: #374151;
        }
        .score {
            color: #6b7280;
            font-size: 14px;
        }
        .empty {
            margin-top: 24px;
            padding: 18px 20px;
            background: #ffffff;
            border-radius: 14px;
            color: #6b7280;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <h1>On-Call 助手文档搜索</h1>
            <p class="subtitle">搜索已加载的 SOP 文档，支持中文、英文以及特殊字符查询。</p>
            <form id="search-form" class="search-bar">
                <input id="query" type="search" placeholder="输入关键词，例如：故障 / OOM / CDN / &" autocomplete="off">
                <button type="submit">搜索</button>
            </form>
            <div class="meta">当前已加载 {{ document_count }} 份文档。</div>
        </section>

        <section id="results" class="results"></section>
        <section id="empty" class="empty" hidden>没有匹配结果。</section>
    </main>

    <script>
        const queryInput = document.getElementById("query");
        const form = document.getElementById("search-form");
        const resultsEl = document.getElementById("results");
        const emptyEl = document.getElementById("empty");
        let debounceTimer = null;

        function renderResults(payload) {
            resultsEl.innerHTML = "";
            const results = payload.results || [];
            emptyEl.hidden = results.length !== 0;

            for (const item of results) {
                const card = document.createElement("article");
                card.className = "card";
                card.innerHTML = `
                    <div class="doc-id">${item.id}</div>
                    <h2>${item.title}</h2>
                    <p class="snippet">${item.snippet || ""}</p>
                    <div class="score">相关度分数: ${item.score}</div>
                `;
                resultsEl.appendChild(card);
            }
        }

        async function runSearch() {
            const query = queryInput.value;
            const response = await fetch(`/v1/search?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            renderResults(data);
        }

        function scheduleSearch() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                runSearch().catch((error) => {
                    emptyEl.hidden = false;
                    emptyEl.textContent = `搜索失败: ${error.message}`;
                });
            }, 250);
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            scheduleSearch();
        });

        queryInput.addEventListener("input", scheduleSearch);

        runSearch().catch(() => {
            emptyEl.hidden = false;
            emptyEl.textContent = "初始化搜索失败，请检查服务是否已正常启动。";
        });
    </script>
</body>
</html>
